<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragancia — UPerfumes</title>
<meta name="description" content="Elige el formato de tu decant y agrégalo al carrito o cómpralo ahora.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2314100D'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='30' fill='%23C6A15B' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E">
</head>
<body>

<!--
  =========================================================================
  FICHA DE PRODUCTO
  =========================================================================
  Se llega desde el catálogo (clic en la foto o el nombre de un perfume):
    producto.html?id=dior-sauvage-edt            (opcional: &ml=5)
  La foto se fija enseguida con el id (images/<id>.jpg) y el resto —nombre,
  precios, descripción— lo dibuja producto.js con GET /api/catalog y los
  textos del sitio, así sigue el idioma elegido.
  =========================================================================
-->

<header class="order-header">
  <div class="order-header__inner order-header__inner--wide">
    <a href="index.html#coleccion" class="order-back">
      <svg width="10" height="16" viewBox="0 0 10 16" fill="none" aria-hidden="true">
        <path d="M9 1L1 8L9 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span data-i18n="order.back">Volver a la colección</span>
    </a>
    <a href="index.html#inicio" class="logo small">UPerfumes</a>
  </div>
</header>

<main class="product-main">
  <div class="product-layout" id="productLayout">
    <div class="product-media">
      <div class="perfume-card__image" id="productImageWrap">
        <img id="productImage" src="" alt="" loading="eager">
        <div class="image-placeholder">
          <svg class="placeholder-icon" viewBox="0 0 48 64" fill="none" aria-hidden="true"><path d="M18 8H30V16C30 16 38 21 38 31V56C38 59 35.5 61 33 61H15C12.5 61 10 59 10 56V31C10 21 18 16 18 16V8Z" stroke="currentColor" stroke-width="1.4"/><path d="M15 4H33V8H15V4Z" stroke="currentColor" stroke-width="1.4"/></svg>
          <p data-i18n="collection.imgPlaceholder">Coloca aquí la imagen</p>
          <code id="productImageCode"></code>
          <span data-i18n="collection.imgSize">800 × 1000&nbsp;px sugerido</span>
        </div>
      </div>
    </div>

    <div class="product-info" id="productInfo" hidden>
      <p class="perfume-card__house" id="productHouse"></p>
      <h1 class="product-title" id="productTitle"></h1>
      <p class="perfume-card__family" id="productFamily"></p>

      <fieldset class="product-formats">
        <legend class="finder-label" data-i18n="product.format">Elige el formato</legend>
        <div class="format-options" id="productFormats" role="radiogroup" aria-label="Formato" data-i18n-aria="buy.formatAriaLabel"></div>
      </fieldset>

      <div class="product-qty">
        <span class="product-qty__label" data-i18n="cart.qty">Cantidad</span>
        <div class="qty" role="group" aria-label="Cantidad" data-i18n-aria="cart.qty">
          <button type="button" id="productQtyDec" data-i18n-aria="cart.dec" aria-label="Disminuir cantidad">−</button>
          <span class="qty__value" id="productQtyValue">1</span>
          <button type="button" id="productQtyInc" data-i18n-aria="cart.inc" aria-label="Aumentar cantidad">+</button>
        </div>
      </div>

      <p class="product-total"><span data-i18n="cart.total">Total</span> <strong id="productTotal"></strong></p>

      <div class="product-actions">
        <a class="cart-btn cart-btn--primary" id="productBuyNow" href="#" data-i18n="buy.buyNow">Comprar ahora</a>
        <button type="button" class="cart-btn cart-btn--ghost" id="productAddCart" data-i18n="buy.addToCart">Agregar al carrito</button>
      </div>

      <p class="perfume-card__desc" id="productDesc"></p>
      <p class="perfume-card__notes" id="productNotes"></p>
    </div>
  </div>

  <div class="order-empty" id="productEmpty" hidden>
    <p data-i18n="product.notFound">No encontramos esta fragancia. Vuelve a la <a href="index.html#coleccion">colección</a> para elegir otra.</p>
  </div>
</main>

<aside class="page-hub" id="pageHub" aria-label="Modo de color e idioma" data-i18n-aria="hub.ariaLabelLite">
  <button type="button" class="theme-toggle" id="themeToggle" role="switch" aria-checked="false" aria-label="Cambiar a modo claro">
    <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <circle cx="10" cy="10" r="3.6" stroke="currentColor" stroke-width="1.3"/>
      <path d="M10 1.5V3.5M10 16.5V18.5M18.5 10H16.5M3.5 10H1.5M15.6 4.4L14.2 5.8M5.8 14.2L4.4 15.6M15.6 15.6L14.2 14.2M5.8 5.8L4.4 4.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <span class="theme-toggle__track"><span class="theme-toggle__thumb"></span></span>
    <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M17 11.5A7 7 0 018.5 3a7 7 0 108.5 8.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="hub-divider" aria-hidden="true"></div>

  <div class="hub-lang" id="langSwitch" role="group" aria-label="Idioma / Language / Idioma">
    <button type="button" class="hub-lang__btn is-active" data-lang="es" aria-pressed="true" aria-label="Español" title="Español">
      <span class="hub-lang__flag" aria-hidden="true">🇪🇸</span>
    </button>
    <button type="button" class="hub-lang__btn" data-lang="en" aria-pressed="false" aria-label="English" title="English">
      <span class="hub-lang__flag" aria-hidden="true">🇬🇧</span>
    </button>
    <button type="button" class="hub-lang__btn" data-lang="pt" aria-pressed="false" aria-label="Português" title="Português">
      <span class="hub-lang__flag" aria-hidden="true">🇵🇹</span>
    </button>
  </div>
</aside>

<!-- Orden: cart.js dibuja el panel del carrito; producto.js fija la foto
     antes de que script.js revise qué imágenes faltan. -->
<script src="cart.js"></script>
<script src="producto.js"></script>
<script src="script.js"></script>
</body>
</html>
